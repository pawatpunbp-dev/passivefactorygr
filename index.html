<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Passive Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: conveyor-belt factory. Sentence parts are colour-coded blocks (S blue, V green, O orange) assembled station by station. */
:root{
  --bg:#EDF1F5; --card:#FFFFFF; --ink:#14202B; --soft:#53606D; --line:#CBD5DF;
  --s:#2563EB; --s-bg:#DBE7FF; --v:#12803D; --v-bg:#D5F2E0; --o:#C25E00; --o-bg:#FFE6CC;
  --hz:#F2C21A; --ok:#12803D; --ok-bg:#D5F2E0; --bad:#B42318; --bad-bg:#FDE1DE;
  --disp:'Bricolage Grotesque','Sarabun',system-ui,sans-serif; --body:'Sarabun',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --card:#18232F; --ink:#E8EEF4; --soft:#9AA8B6; --line:#2D3C4B;
  --s:#7FA8FF; --s-bg:#1E3158; --v:#5BD48A; --v-bg:#173A29; --o:#FFAA5C; --o-bg:#4A2D10;
  --ok:#5BD48A; --ok-bg:#173A29; --bad:#FF8A7E; --bad-bg:#4A1D19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --card:#18232F; --ink:#E8EEF4; --soft:#9AA8B6; --line:#2D3C4B;
  --s:#7FA8FF; --s-bg:#1E3158; --v:#5BD48A; --v-bg:#173A29; --o:#FFAA5C; --o-bg:#4A2D10;
  --ok:#5BD48A; --ok-bg:#173A29; --bad:#FF8A7E; --bad-bg:#4A1D19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:14px 0 0}
.brand{font:800 18px var(--disp);color:var(--ink);text-decoration:none}
.who{font:600 13px var(--mono);padding:6px 10px;border-radius:999px;background:var(--hz);color:#14202B;text-decoration:none;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app{max-width:760px;margin:0 auto}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
h1{font:800 clamp(30px,7vw,44px)/1.05 var(--disp);margin:8px 0 6px;letter-spacing:-.01em}
h1.lh{font-size:clamp(26px,6vw,36px)}
.hero{padding:20px 0 6px}
.sub{color:var(--soft);margin:0 0 12px}
.belt{height:10px;margin:10px 0 16px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--hz) 0 12px,var(--ink) 12px 24px);opacity:.9}
.crumb{padding:16px 0 4px}.crumb a{color:var(--soft);font-weight:600;text-decoration:none}
.sec{font:800 20px var(--disp);margin:26px 0 10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;margin:0 0 14px}
.card h2{font:800 22px/1.2 var(--disp);margin:0 0 4px}
.card h3{font:800 17px var(--disp);margin:0 0 6px}
.th{color:var(--soft);margin:0 0 14px}
.soft{color:var(--soft)}
.hint{color:var(--soft);font-size:15px;margin:10px 0 0}
.tag{display:inline-block;font:600 12px var(--mono);letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--bg);margin-bottom:8px}
nav.st{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
nav.st button{font:600 14px var(--body);min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav.st button[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
nav.st button.done::after{content:" ✓";color:var(--ok)}
nav.st button[aria-current="true"].done::after{color:var(--bg)}
.blk{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;font:600 18px var(--body);margin:4px 4px 4px 0;border:2px solid transparent}
.blk.S{background:var(--s-bg);color:var(--s);border-color:var(--s)} .blk.V{background:var(--v-bg);color:var(--v);border-color:var(--v)} .blk.O{background:var(--o-bg);color:var(--o);border-color:var(--o)} .blk.X{background:var(--card);color:var(--ink);border-color:var(--line)}
button.blk{cursor:pointer} button.blk:disabled{opacity:.35;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px}
.slot{min-width:64px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:2px dashed var(--line);color:var(--soft);font:600 14px var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.btn{font:700 16px var(--body);min-height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
a:focus-visible,.btn:focus-visible,nav.st button:focus-visible,.blk:focus-visible,select:focus-visible,input:focus-visible,.mini button:focus-visible,summary:focus-visible{outline:3px solid var(--s);outline-offset:2px}
select,input[type=text],input[type=number]{font:600 17px var(--body);min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;max-width:100%}
input[type=text]{width:100%}
.fb{min-height:26px;margin:8px 0 0;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.pair{display:grid;gap:10px;margin:8px 0 14px}
.pair>div{padding:12px 14px;border-radius:12px;background:var(--bg)}
.pair b{display:block;font:600 12px var(--mono);letter-spacing:.08em;color:var(--soft);margin-bottom:4px;text-transform:uppercase}
.det{font:700 20px var(--disp)} .det u{text-decoration-color:var(--bad);text-underline-offset:4px;text-decoration-thickness:3px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;gap:6px;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.steps li.cur{border-color:var(--ink)} .steps li.fin{border-color:var(--ok);background:var(--ok-bg)} .steps li.lock{opacity:.45}
.steps .q{font-weight:700}
.out{font:800 24px/1.3 var(--disp);padding:14px;border-radius:12px;background:var(--bg);margin:12px 0;min-height:60px}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 15px var(--mono)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.mini button{font:700 13px var(--mono);min-height:44px;padding:0 12px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mini button[aria-current="true"]{background:var(--s);color:#fff;border-color:var(--s)}
.ref{margin:6px 0 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 16px}
.ref summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px;background:var(--card)}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.hi td{background:var(--s-bg)}
.mono{font-family:var(--mono);font-size:14px}
.idgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.idgrid .wide{grid-column:1/-1}
.field{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--soft)}
.map{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lvl{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;min-height:64px}
.lvl .n{flex:none;width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 18px var(--disp)}
.lvl .t{flex:1;min-width:0;display:grid}.lvl .t small{color:var(--soft)}
.lvl .sc{font:600 14px var(--mono);color:var(--soft)}
.lvl.boss .n{background:var(--hz);color:#14202B}
.report .rtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stamp{font:600 13px var(--mono);color:var(--soft)}
.rwho{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:12px 0}.rwho .wide{grid-column:1/-1}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0}.big span{font:800 56px/1 var(--disp)}.big small{font:600 15px var(--mono);color:var(--soft)}
.rk{margin:0 0 12px}
.srow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--s)}
@media (max-width:480px){.idgrid,.rwho{grid-template-columns:1fr 1fr}.srow{grid-template-columns:1fr auto}.srow .bar{grid-column:1/-1;order:3}}
@media (max-width:560px){
 .tbl table{min-width:0}.tbl thead{display:none}.tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{border:1.5px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 4px;background:var(--card)}
 .tbl tr.hi{border-color:var(--s)}.tbl td{border:0;padding:4px 10px}
 .tbl td[data-l]::before{content:attr(data-l);display:block;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}}
</style>
</head>

      $('#cd',bd).onclick=function(){var ok=match($('#td',bd).value,[d.ans]);first(K('bD'),ok);f(ok?'ถูก! '+d.ans:'ยังไม่ถูก ลองเช็คสูตรของ '+L.short,ok);if(ok)speak(d.ans);};};
    paint();};
  V[5]=function(b){hd(b,5,'Error Detective','แต่ละประโยคมีจุดผิด 1 อย่าง เลือกว่าผิดเรื่องอะไร');var left=L.detect.items.length;
    L.detect.items.forEach(function(q,qi){var d=el('div','pair','<div><b>ข้อ '+(qi+1)+'</b><span class="det">'+q.t+'</span></div><div class="row" id="o'+qi+'"></div><p class="fb" id="f'+qi+'" aria-live="polite"></p>');b.appendChild(d);
      L.detect.opts.forEach(function(o,oi){var bt=el('button','blk X',esc(o));bt.type='button';bt.onclick=function(){var ok=oi===q.a;first(K('dt'+qi),ok);var f=$('#f'+qi,b);if(ok){f.className='fb ok';f.textContent='ถูก! แก้เป็น: '+q.fix;$('#o'+qi,b).querySelectorAll('button').forEach(function(x){x.disabled=true;});left--;if(!left){fin(5);nav();b.appendChild(el('p','fb ok','🎉 จบ Level '+L.n+' ได้ '+scoreOf(L.id)+' / '+maxOf(L)+' คะแนน'));nextBtn(b,L.n<5?'ไป Level '+(L.n+1)+' →':'ไปด่าน Boss →');}}else{f.className='fb bad';f.textContent='ยังไม่ใช่ ลองใหม่';}};$('#o'+qi,b).appendChild(bt);});});};
  function draw(){var b=$('#stn');b.innerHTML='';V[si](b);}
  nav();draw();
}

/* ---------- boss ---------- */
function boss(){var i=0,w=el('div');app.appendChild(w);
  function q(){var it=BOSS[i];w.innerHTML='<div class="crumb"><a href="#home">← Home</a></div><span class="eyebrow">Boss · '+(i+1)+' / '+BOSS.length+'</span><h1 class="lh">Mixed Tenses</h1><div class="belt"></div><section class="card"><span class="tag">'+esc(it.tn)+'</span><h2>เปลี่ยนเป็น passive</h2><p class="th">พิมพ์ประโยค passive ให้ตรง Tense ที่บอก (ใส่ by + ผู้กระทำหรือไม่ใส่ก็ได้)</p><p style="font:700 20px var(--disp)">'+esc(it.a)+'</p><input type="text" id="bi" aria-label="passive sentence" autocomplete="off"><div class="row"><button class="btn" type="button" id="bc">Check</button></div><p class="fb" id="bf" aria-live="polite"></p></section><div id="hp"></div>';
    $('#hp').appendChild(helpPanel());
    $('#bc').onclick=function(){var ok=match($('#bi').value,it.ans);first('B.'+i,ok);var f=$('#bf');f.className='fb '+(ok?'ok':'bad');f.textContent=ok?'ถูก! '+it.ans[0]:'เฉลย: '+it.ans[0];if(ok)speak(it.ans[0]);$('#bc').disabled=true;$('#bi').disabled=true;
      var r=el('div','row','<button class="btn" type="button">'+(i<BOSS.length-1?'ข้อถัดไป →':'ดู Score Report →')+'</button>');r.firstChild.onclick=function(){if(i<BOSS.length-1){i++;q();}else{S.done.B=true;save();location.hash='#score';}};f.parentNode.appendChild(r);};}
  q();}

/* ---------- score ---------- */
function score(){var t=totals(),pct=t.max?Math.round(t.got*100/t.max):0,w=el('div');app.appendChild(w);
  var rows=LV.map(function(L){var g=scoreOf(L.id),m=maxOf(L);return '<div class="srow"><span>L'+L.n+' · '+esc(L.short)+'</span><div class="bar"><i style="width:'+Math.round(g*100/m)+'%"></i></div><b>'+g+'/'+m+'</b></div>';}).join('')+'<div class="srow"><span>Boss · Mixed</span><div class="bar"><i style="width:'+Math.round(scoreOf('B')*100/BOSS.length)+'%"></i></div><b>'+scoreOf('B')+'/'+BOSS.length+'</b></div>';
  w.innerHTML='<div class="crumb"><a href="#home">← Home</a></div><section class="card report" id="report"><div class="rtop"><div><span class="tag">Passive Factory · อ23102</span><h2>Score Report</h2></div><span class="stamp">'+esc(stamp())+'</span></div><div class="rwho"><label class="field wide">Name<input type="text" id="sn" maxlength="60"></label><label class="field">Class<input type="text" id="sc" maxlength="12"></label><label class="field">No.<input type="number" id="so" min="1" max="99"></label></div><div class="big"><span>'+t.got+'</span><small>/'+t.max+' · '+pct+'%</small></div><p class="rk"><b>'+rank(pct)+'</b>'+(pct>=80?' · ✓ ผ่านเกณฑ์ (80%)':' · ยังไม่ถึงเกณฑ์ 80%')+'</p>'+rows+'<p class="soft" style="margin:10px 0 0">ใช้ตัวช่วย (เปิดตารางสูตรในด่าน) '+(S.help||0)+' ครั้ง</p></section>'+
   '<div class="card"><h3>ส่งครูอย่างไร</h3><p class="soft" style="margin:0">แคปหน้าการ์ด Score Report ให้เห็นชื่อ คะแนนรวม และวันเวลา แล้วส่งตามที่ครูกำหนด</p></div><div class="card"><h3>คัดลอกสรุปคะแนน</h3><button class="btn ghost" type="button" id="cp">Copy summary</button> <span class="hint" id="cpm"></span></div><div class="card"><h3>เริ่มใหม่</h3><p class="soft" style="margin:0 0 10px">ลบคำตอบและคะแนนทั้งหมดในเครื่องนี้ (ถ้าใช้เครื่องร่วมกัน ให้กดก่อนเปลี่ยนคน)</p><div id="rs"><button class="btn ghost" type="button" id="r1">Reset all</button></div></div>';
  $('#sn').value=S.name;$('#sc').value=S.cls;$('#so').value=S.no;
  ['sn','sc','so'].forEach(function(id){$('#'+id).addEventListener('input',function(){S.name=$('#sn').value;S.cls=$('#sc').value;S.no=$('#so').value;save();paintTop();});});
  $('#cp').onclick=function(){var txt='Passive Factory · '+S.name+' ('+S.cls+' เลขที่ '+S.no+') · '+t.got+'/'+t.max+' ('+pct+'%) · '+stamp();var ok=function(){$('#cpm').textContent='คัดลอกแล้ว';};try{navigator.clipboard.writeText(txt).then(ok,function(){fall(txt);});}catch(e){fall(txt);}};
  function fall(txt){var ta=el('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');$('#cpm').textContent='คัดลอกแล้ว';}catch(e){$('#cpm').textContent=txt;}ta.remove();}
  $('#r1').onclick=function(){$('#rs').innerHTML='<p class="fb bad">ลบคะแนนทั้งหมดจริงหรือไม่?</p><div class="row"><button class="btn" type="button" id="r2">ยืนยัน ลบเลย</button><button class="btn ghost" type="button" id="r3">ยกเลิก</button></div>';$('#r2').onclick=function(){store.del(KEY);S={name:'',cls:'',no:'',keys:{},done:{},help:0};location.hash='#home';route();};$('#r3').onclick=function(){score_reset();};};
  function score_reset(){app.innerHTML='';score();}
}
window.__pf={LV:LV,BOSS:BOSS};
route();
})();
